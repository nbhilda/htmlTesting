name: Terraform AWS ECR Setup
on:
  push:
    branches:
      - bihbranch
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'image tag to deploy'
        required: true
        default: 'latest'
        
#AWS ECR Setup        
jobs:
  htmlTesting:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: login into aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'false'

      - name: Build image to Amazon ECR
        id: build-image
        run: |
          docker build -t ecr-repo:latest .

      - name: tag image to Amazon ECR
        run: docker tag ecr-repo:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ecr-repo:${{ github.event.inputs.image_tag }}
        
      - name: Push image to Amazon ECR
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ecr-repo:${{ github.event.inputs.image_tag }}
 
            

